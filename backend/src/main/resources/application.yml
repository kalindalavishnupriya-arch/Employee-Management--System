spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sempms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:"your password"}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jackson:
    serialization:
      indent_output: true

server:
  port: 8080

jwt:
  secret: c21hcnQtZW1wbG95ZWUtcHJvamVjdC1tYW5hZ2VtZW50LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS0yMDI2
  expiration-in-ms: 86400000

app:
  upload:
    dir: ./uploads

logging:
  level:
    root: INFO
    com.example.sempms: DEBUG
